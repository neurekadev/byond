name: Release

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force_overwrite:
        description: Overwrite existing image tags.
        required: false
        default: false
        type: boolean

env:
  REGISTRY: code.neureka.dev
  REGISTRY_USERNAME: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.REGISTRY_TOKEN }}
  REGISTRY_IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Make REGISTRY_IMAGE_NAME lowercase.
        run: |
          echo "REGISTRY_IMAGE_NAME=${REGISTRY_IMAGE_NAME@L}" >> ${GITHUB_ENV}          

      - name: Login to the Container Registry
        uses: actions/docker-login@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Check for the latest stable version of BYOND
        id: stable-version-check
        continue-on-error: true
        run: |
          echo "⏳ Checking for the latest stable version of BYOND..."
          BYOND_VERSION="$(sed -n 1p <(curl https://secure.byond.com/download/version.txt))"
          BYOND_MAJOR_VERSION="$(echo "$(cut -d '.' -f 1 <(echo "$BYOND_VERSION"))")"
          BYOND_MINOR_VERSION="$(echo "$(cut -d '.' -f 2 <(echo "$BYOND_VERSION"))")"
          echo "BYOND_VERSION="$BYOND_VERSION"" >> $GITHUB_OUTPUT
          echo "BYOND_MAJOR_VERSION="$BYOND_MAJOR_VERSION"" >> $GITHUB_OUTPUT
          echo "BYOND_MINOR_VERSION="$BYOND_MINOR_VERSION"" >> $GITHUB_OUTPUT

          if [ ! -z $BYOND_VERSION ]; then
            echo "✔️ The latest stable version of BYOND: ${BYOND_VERSION}"
          else
            echo "❌ The latest stable version of BYOND could not be found."
            exit 1
          fi          

      - name: Check for stable linux release binaries
        id: stable-binaries-check
        if: ${{ steps.stable-version-check.outcome == 'success' }}
        continue-on-error: true
        env:
          BYOND_VERSION: ${{ steps.stable-version-check.outputs.BYOND_VERSION }}
          BYOND_MAJOR_VERSION: ${{ steps.stable-version-check.outputs.BYOND_MAJOR_VERSION }}
          BYOND_MINOR_VERSION: ${{ steps.stable-version-check.outputs.BYOND_MINOR_VERSION }}
        run: |
          echo "⏳ Checking for stable linux release binaries..."
          RESPONSE=$(curl --head --silent "https://www.byond.com/download/build/${BYOND_MAJOR_VERSION}/${BYOND_MAJOR_VERSION}.${BYOND_MINOR_VERSION}_byond_linux.zip" | head -n1 | cut -d ' ' -f 2)
          RESPONSE=$(($RESPONSE))

          if [ $RESPONSE -eq 200 ]; then
            echo "✔️ Stable linux release binaries were found for BYOND version: ${BYOND_VERSION}"
          else
            echo "❌ Stable linux release binaries could not be found for BYOND version: ${BYOND_VERSION}"
            exit $RESPONSE
          fi          

      - name: Check if the stable release was already published to the Container Registry
        id: stable-release-check
        if: ${{ steps.stable-binaries-check.outcome == 'success' }}
        continue-on-error: true
        env:
          BYOND_VERSION: ${{ steps.stable-version-check.outputs.BYOND_VERSION }}
          BYOND_MAJOR_VERSION: ${{ steps.stable-version-check.outputs.BYOND_MAJOR_VERSION }}
          BYOND_MINOR_VERSION: ${{ steps.stable-version-check.outputs.BYOND_MINOR_VERSION }}
          FORCE_OVERWRITE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_overwrite }}
        run: |
          echo "⏳ Checking if the stable release was already published to the Container Registry..."
          docker manifest inspect ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE_NAME }}:${{ env.BYOND_VERSION }}
          if [ $? -eq 0 ]; then
            if [ "${FORCE_OVERWRITE}" = "true" ]; then
              echo "✔️ An existing tag was found! A new docker image will be built because force_overwrite is enabled."
            else
              echo "✔️ An existing tag was found! A new docker image will not be built."
            fi
          else
            echo "❌ An existing tag was not found."
          fi          

      - name: Build the stable Docker image and publish to the Container Registry
        uses: actions/docker-build-push@v7
        if: ${{ steps.stable-binaries-check.outcome == 'success' && (steps.stable-release-check.outcome == 'failure' || (github.event_name == 'workflow_dispatch' && inputs.force_overwrite)) }}
        env:
          BYOND_VERSION: ${{ steps.stable-version-check.outputs.BYOND_VERSION }}
          BYOND_MAJOR_VERSION: ${{ steps.stable-version-check.outputs.BYOND_MAJOR_VERSION }}
          BYOND_MINOR_VERSION: ${{ steps.stable-version-check.outputs.BYOND_MINOR_VERSION }}
        with:
          context: .
          push: true
          build-args: |
            BYOND_MAJOR=${{ env.BYOND_MAJOR_VERSION }}
            BYOND_MINOR=${{ env.BYOND_MINOR_VERSION }}            
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE_NAME }}:${{ env.BYOND_VERSION }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE_NAME }}:${{ env.BYOND_MAJOR_VERSION }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE_NAME }}:latest            

      # BYOND Beta Releases
      - name: Check for the latest beta version of BYOND
        id: beta-version-check
        continue-on-error: true
        run: |
          echo "⏳ Checking for the latest beta version of BYOND..."
          BYOND_VERSION="$(sed -n 2p <(curl https://secure.byond.com/download/version.txt))"
          BYOND_MAJOR_VERSION="$(echo "$(cut -d '.' -f 1 <(echo "$BYOND_VERSION"))")"
          BYOND_MINOR_VERSION="$(echo "$(cut -d '.' -f 2 <(echo "$BYOND_VERSION"))")"
          echo "BYOND_VERSION="$BYOND_VERSION"" >> $GITHUB_OUTPUT
          echo "BYOND_MAJOR_VERSION="$BYOND_MAJOR_VERSION"" >> $GITHUB_OUTPUT
          echo "BYOND_MINOR_VERSION="$BYOND_MINOR_VERSION"" >> $GITHUB_OUTPUT

          if [ ! -z $BYOND_VERSION ]; then
            echo "✔️ The latest beta version of BYOND: ${BYOND_VERSION}"
          else
            echo "❌ The latest beta version of BYOND could not be found."
            exit 1
          fi          

      - name: Check for beta linux release binaries
        id: beta-binaries-check
        if: ${{ steps.beta-version-check.outcome == 'success' }}
        continue-on-error: true
        env:
          BYOND_VERSION: ${{ steps.beta-version-check.outputs.BYOND_VERSION }}
          BYOND_MAJOR_VERSION: ${{ steps.beta-version-check.outputs.BYOND_MAJOR_VERSION }}
          BYOND_MINOR_VERSION: ${{ steps.beta-version-check.outputs.BYOND_MINOR_VERSION }}
        run: |
          echo "⏳ Checking for beta linux release binaries..."
          RESPONSE=$(curl --head --silent "https://www.byond.com/download/build/${BYOND_MAJOR_VERSION}/${BYOND_MAJOR_VERSION}.${BYOND_MINOR_VERSION}_byond_linux.zip" | head -n1 | cut -d ' ' -f 2)
          RESPONSE=$(($RESPONSE))

          if [ $RESPONSE -eq 200 ]; then
            echo "✔️ Beta linux release binaries were found for BYOND version: ${BYOND_VERSION}"
          else
            echo "❌ Beta linux release binaries could not be found for BYOND version: ${BYOND_VERSION}"
            exit $RESPONSE
          fi          

      - name: Check if the beta release was already published to the Container Registry
        id: beta-release-check
        if: ${{ steps.beta-binaries-check.outcome == 'success' }}
        continue-on-error: true
        env:
          BYOND_VERSION: ${{ steps.beta-version-check.outputs.BYOND_VERSION }}
          BYOND_MAJOR_VERSION: ${{ steps.beta-version-check.outputs.BYOND_MAJOR_VERSION }}
          BYOND_MINOR_VERSION: ${{ steps.beta-version-check.outputs.BYOND_MINOR_VERSION }}
          FORCE_OVERWRITE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_overwrite }}
        run: |
          echo "⏳ Checking if the beta release was already published to the Container Registry..."
          docker manifest inspect ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE_NAME }}:${{ env.BYOND_VERSION }}
          if [ $? -eq 0 ]; then
            if [ "${FORCE_OVERWRITE}" = "true" ]; then
              echo "✔️ An existing tag was found! A new docker image will be built because force_overwrite is enabled."
            else
              echo "✔️ An existing tag was found! A new docker image will not be built."
            fi
          else
            echo "❌ An existing tag was not found."
          fi          

      - name: Build the beta Docker image and publish to the Container Registry
        uses: actions/docker-build-push@v7
        if: ${{ steps.beta-binaries-check.outcome == 'success' && (steps.beta-release-check.outcome == 'failure' || (github.event_name == 'workflow_dispatch' && inputs.force_overwrite)) }}
        env:
          BYOND_VERSION: ${{ steps.beta-version-check.outputs.BYOND_VERSION }}
          BYOND_MAJOR_VERSION: ${{ steps.beta-version-check.outputs.BYOND_MAJOR_VERSION }}
          BYOND_MINOR_VERSION: ${{ steps.beta-version-check.outputs.BYOND_MINOR_VERSION }}
        with:
          context: .
          push: true
          build-args: |
            BYOND_MAJOR=${{ env.BYOND_MAJOR_VERSION }}
            BYOND_MINOR=${{ env.BYOND_MINOR_VERSION }}            
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE_NAME }}:${{ env.BYOND_VERSION }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE_NAME }}:${{ env.BYOND_MAJOR_VERSION }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_IMAGE_NAME }}:beta
