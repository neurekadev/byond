name: CI

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Image build to run.
        required: true
        default: release
        type: choice
        options:
          - release
          - version
          - major
      value:
        description: Full version for "version" or major version for "major".
        required: false
        type: string
      force_overwrite:
        description: Overwrite existing image tags.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/neurekadev/byond

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate manual inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          VALUE: ${{ inputs.value }}
        run: |
          case "$TARGET" in
            release)
              if [[ -n "$VALUE" ]]; then
                echo "The value input must be empty for a release build." >&2
                exit 1
              fi
              ;;
            version)
              if [[ ! "$VALUE" =~ ^[0-9]+\.[0-9]+$ ]]; then
                echo "The value input must be a full BYOND version such as 516.1659." >&2
                exit 1
              fi
              ;;
            major)
              if [[ ! "$VALUE" =~ ^[0-9]+$ ]]; then
                echo "The value input must be a BYOND major version such as 515." >&2
                exit 1
              fi
              ;;
          esac

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build stable image
        id: stable
        if: github.event_name == 'schedule' || inputs.target == 'release'
        env:
          BUILD_METADATA_FILE: ${{ runner.temp }}/stable-build-metadata.json
          FORCE_OVERWRITE: ${{ inputs.force_overwrite || false }}
        run: |
          sh ci/build.sh --channel stable --floating-tags latest --on-existing skip --on-missing skip
          if [ -s "$BUILD_METADATA_FILE" ]; then
            echo "digest=$(jq -er '."containerimage.digest"' "$BUILD_METADATA_FILE")" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest stable image
        if: steps.stable.outputs.digest != ''
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.stable.outputs.digest }}

      - name: Build beta image
        id: beta
        if: github.event_name == 'schedule' || inputs.target == 'release'
        env:
          BUILD_METADATA_FILE: ${{ runner.temp }}/beta-build-metadata.json
          FORCE_OVERWRITE: ${{ inputs.force_overwrite || false }}
        run: |
          sh ci/build.sh --channel beta --floating-tags beta --on-existing skip --on-missing skip
          if [ -s "$BUILD_METADATA_FILE" ]; then
            echo "digest=$(jq -er '."containerimage.digest"' "$BUILD_METADATA_FILE")" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest beta image
        if: steps.beta.outputs.digest != ''
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.beta.outputs.digest }}

      - name: Build exact version
        id: version
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'version'
        env:
          BUILD_METADATA_FILE: ${{ runner.temp }}/version-build-metadata.json
          BUILD_VALUE: ${{ inputs.value }}
          FORCE_OVERWRITE: ${{ inputs.force_overwrite }}
        run: |
          sh ci/build.sh --version "$BUILD_VALUE" --on-existing fail
          if [ -s "$BUILD_METADATA_FILE" ]; then
            echo "digest=$(jq -er '."containerimage.digest"' "$BUILD_METADATA_FILE")" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest exact version
        if: steps.version.outputs.digest != ''
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.version.outputs.digest }}

      - name: Build major backport
        id: major
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'major'
        env:
          BUILD_METADATA_FILE: ${{ runner.temp }}/major-build-metadata.json
          BUILD_VALUE: ${{ inputs.value }}
          FORCE_OVERWRITE: ${{ inputs.force_overwrite }}
        run: |
          sh ci/build.sh --major "$BUILD_VALUE" --on-existing skip
          if [ -s "$BUILD_METADATA_FILE" ]; then
            echo "digest=$(jq -er '."containerimage.digest"' "$BUILD_METADATA_FILE")" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest major backport
        if: steps.major.outputs.digest != ''
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.major.outputs.digest }}
